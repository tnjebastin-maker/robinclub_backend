spring.application.name=e-commerce

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# JWT
app.jwt.secret=${JWTSECRET}
app.jwt.expiration=86400000

# Google OAuth2
app.google.client-id=${GOOGLE_CLIENT_ID}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/

# Cloudinary
cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${API_KEY}
cloudinary.api_secret=${API_SECRET}

# Razorpay
app.razorpay.key-id=${RAZORKEY}
app.razorpay.key-secret=${RAZORSECRET}

# CORS
app.cors.allowed-origins=https://robinclub-frontend.vercel.app,http://localhost:3000

server.port=${PORT:8080}

# Twilio SMS
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-number=${TWILIO_FROM_NUMBER}
app.admin.phone=${ADMIN_PHONE}
